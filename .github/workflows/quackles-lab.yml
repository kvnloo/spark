name: Spark Quackles downstream lab
on:
  push:
    branches:
      - experiments/quackles-continuity
  workflow_dispatch:
permissions:
  contents: read
env:
  SPARK_LAB_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
      - run: npm ci
      - run: node --test scripts/lab/*.test.mjs
      - run: npx biome check scripts/lab test/browser/quackles-lab.test.ts test/browser/quackles-settle.test.ts
      - name: Export pinned formatter for offline reproduction
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pinned-lab-formatter
          path: |
            node_modules/@biomejs/cli-linux-x64/biome
            biome.json
          retention-days: 2
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-spark-lab-${{ hashFiles('rust/Cargo.lock') }}
      - run: rustup target add wasm32-unknown-unknown
      - run: command -v wasm-pack || cargo install wasm-pack --locked
      - run: npm run build:wasm
      - run: npm run types
      - run: npm test
      - name: Package exact-source runtime for offline reproduction
        run: |
          mkdir -p artifacts/runtime
          git archive HEAD > artifacts/runtime/source.tar
          tar -czf artifacts/runtime/toolchain.tar.gz node_modules rust/spark-rs/pkg
      - name: Export reproducible runtime
        uses: actions/upload-artifact@v7
        with:
          name: spark-lab-offline-runtime
          path: artifacts/runtime/
          retention-days: 2
      - run: npx playwright install --with-deps chromium
      - name: Isolate static versus moving high-LOD settle failure
        id: browser
        run: >-
          SPARK_LAB_DIAGNOSTICS=1 npm run test:browser --
          quackles-settle.test.ts paged-lod.test.ts --grep
          'renders paged LoD with lodSplatCount=100000|@settle-diagnostics'
      - name: Export exact generated fixtures for local reproduction
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: spark-lab-exact-fixtures
          path: test/browser/fixtures/
          retention-days: 7
      - name: Export receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: quackles-spark-diagnostic-receipts
          path: |
            artifacts/spark-quackles/
            test/browser/playwright-report/
          if-no-files-found: warn
          retention-days: 14

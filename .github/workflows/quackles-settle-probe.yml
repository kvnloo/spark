name: Spark motion settle diagnostic
on:
  push:
    branches:
      - experiments/quackles-settle-probe
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
      - name: Reuse exact locked dependencies and compiled WASM
        uses: actions/download-artifact@v8
        with:
          name: spark-lab-offline-runtime
          run-id: 39385731760
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/runtime
      - name: Verify dependency provenance before extraction
        shell: bash
        run: |
          tar -xOf artifacts/runtime/source.tar package-lock.json | cmp - package-lock.json
          tar -xOf artifacts/runtime/source.tar rust/Cargo.lock | cmp - rust/Cargo.lock
          tar -xzf artifacts/runtime/toolchain.tar.gz
      - name: Reuse the original probe fixture bytes
        uses: actions/download-artifact@v8
        with:
          name: spark-pinned-browser-fixtures
          run-id: 39387866829
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: test/browser/fixtures
      - run: npm run types
      - run: npx biome check test/browser/quackles-readback-probe.test.ts
      - run: npx playwright install --with-deps chromium
      - name: Trace pending readbacks and preserve all three controls
        run: SPARK_READBACK_PROBE=1 npm run test:browser -- --grep @readback-probe
      - name: Export state and browser reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: spark-readback-probe-evidence
          path: |
            artifacts/readback-probe/
            test/browser/playwright-report/
          retention-days: 14
